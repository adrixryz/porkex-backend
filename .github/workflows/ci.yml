name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The test harness boots its own server per suite with a throwaway
      # database, but the app reads these at import time, so provide them.
      DATABASE_URL: file:./prisma/ci.db
      TURSO_AUTH_TOKEN: ''
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci runs the postinstall hook, which generates the Prisma client.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:check
      - run: npm test

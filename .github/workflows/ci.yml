name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The test harness boots its own server per suite with a throwaway
      # database, but the app reads these at import time, so provide them.
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci runs the postinstall hook, which generates the Prisma client.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
